name: Update job postings
on:
  schedule:
    - cron: "0 13 * * *"   # daily, 6am Mountain (7am in winter)
  workflow_dispatch:
  push:
    paths: ["scripts/**", ".github/workflows/update-jobs.yml"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/fetch_jobs.py
      - name: Commit if changed
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add jobs.json
          git diff --cached --quiet && echo "no change" || (git commit -m "Daily job postings $(date -u +%F)" && git push)
